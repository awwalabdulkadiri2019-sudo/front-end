<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* PAGE */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        /* REGISTRATION CARD */
        form {
            width: 100%;
            max-width: 500px;
            padding: 40px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        /* USER ICON */
        .user-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fff1e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        /* HEADING */
        .title {
            text-align: center;
            font-size: 30px;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* INPUT GROUP */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: orange;
            box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.12);
        }

        /* TERMS */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 10px 0 25px;
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        .terms input {
            width: 16px;
            height: 16px;
            margin-top: 2px;
            accent-color: orange;
        }

        .terms a {
            color: orange;
            text-decoration: none;
            font-weight: 600;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        /* REGISTER BUTTON */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: orange;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: darkorange;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(255, 165, 0, 0.25);
        }

        button:active {
            transform: translateY(0);
        }

        /* LOGIN LINK */
        .login {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .login a {
            color: orange;
            text-decoration: none;
            font-weight: 700;
        }

        .login a:hover {
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            form {
                padding: 30px 22px;
            }

            .title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <form action="">

        <!-- User Icon -->
        <div class="user-icon">
            👤
        </div>

        <!-- Heading -->
        <h1 class="title">Create Account</h1>

        <p class="subtitle">
            Join us today and get started
        </p>

        <!-- Full Name -->
        <div class="input-group">
            <label for="fullname">Full Name</label>

            <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
                required
            >
        </div>

        <!-- Email -->
        <div class="input-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required
            >
        </div>

        <!-- Mobile Number -->
        <div class="input-group">
            <label for="phone">Mobile Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter your mobile number"
                required
            >
        </div>

        <!-- Password -->
        <div class="input-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >
        </div>

        <!-- Confirm Password -->
        <div class="input-group">
            <label for="confirm-password">Confirm Password</label>

            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm your password"
                required
            >
        </div>

        <!-- Terms -->
        <div class="terms">

            <input
                type="checkbox"
                id="terms"
                required
            >

            <label for="terms">
                I agree to the
                <a href="#">Terms & Conditions</a>
                and
                <a href="#">Privacy Policy</a>
            </label>

        </div>

        <!-- Register -->
        <button type="submit">
            Register
        </button>

        <!-- Login -->
        <p class="login">
            Already have an account?
            <a href="#">Login</a>
        </p>

    </form>
 
 <a href="forgot password.html">Forgot Password</a>

</body>
</html>
