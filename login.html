 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Page */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, none);
            padding: 20px;
        }

        /* Login Card */
        form {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        /* Heading */
        .title {
            text-align: center;
            margin-bottom: 8px;
            font-size: 30px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Input Group */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #ff8c00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.15);
        }

        /* Remember / Forgot Password */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 25px;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #555;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ff8c00;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: #ff8c00;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Login Button */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ff8c00;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e67e00;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(255, 140, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* Create Account */
        .create-account {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        /* Mobile */
        @media (max-width: 480px) {
            form {
                padding: 30px 22px;
            }

            .title {
                font-size: 26px;
            }

            .options {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <form action="">

        <h1 class="title">Welcome Back</h1>

        <p class="subtitle">
            Login to your account to continue
        </p>

        <!-- Email / Phone -->
        <div class="input-group">
            <label for="email">Email or Mobile Number</label>
            <input
                type="text"
                id="email"
                placeholder="Enter your email or phone number"
                required
            >
        </div>

        <!-- Password -->
        <div class="input-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >
        </div>

        <!-- Options -->
        <div class="options">

            <div class="remember">
                <input
                    type="checkbox"
                    id="remember"
                >
                <label for="remember">Remember me</label>
            </div>

            <a href="forgot password.html">Forgot Password?</a>

        </div>

        <!-- Login -->
        <button type="submit">
            Login
        </button>

        <!-- Create Account -->
        <p class="create-account">
            Don't have an account?
            <a href="registration.html">Create account</a>
        </p>

    </form>

</body>
</html>
