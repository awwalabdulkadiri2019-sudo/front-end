
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* PAGE */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* CARD */
        .card {
            width: 100%;
            max-width: 450px;
            background: #fff;
            padding: 45px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        /* BACK LINK */
        .back {
            display: inline-block;
            margin-bottom: 30px;
            color: orange;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back:hover {
            color: darkorange;
            transform: translateX(-3px);
        }

        /* ICON */
        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fff1e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        /* TITLE */
        h1 {
            text-align: center;
            color: #222;
            font-size: 30px;
            margin-bottom: 10px;
        }

        /* DESCRIPTION */
        .description {
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* INPUT GROUP */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #aaa;
        }

        .input-group input:focus {
            border-color: orange;
            box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.12);
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: orange;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: darkorange;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(255, 165, 0, 0.25);
        }

        button:active {
            transform: translateY(0);
        }

        /* LOGIN */
        .login {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .login a {
            color: orange;
            text-decoration: none;
            font-weight: 700;
        }

        .login a:hover {
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 26px;
            }

            .description {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- Back -->
        <a href="javascript:history.back()" class="back">
            ← Go Back
        </a>

        <!-- Icon -->
        <div class="icon">
            🔐
        </div>

        <!-- Heading -->
        <h1>Forgot Password?</h1>

        <p class="description">
            Don't worry, it happens to everyone.
            Enter the email address associated with your account
            and we'll send you a link to reset your password.
        </p>

        <!-- Form -->
        <form action="">

            <div class="input-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >
            </div>

            <button type="submit">
                Send Reset Link
            </button>

        </form>

        <!-- Login -->
        <p class="login">
            Remember your password?
            <a href="login.html">Back to Login</a>
        </p>

    </div>

</body>
</html>
```
